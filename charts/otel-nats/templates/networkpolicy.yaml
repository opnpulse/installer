{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-forwarder
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "otel-nats.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "otel-nats.forwarder.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    # metrics scrape from anywhere in-cluster (limit further at scrape time)
    - ports:
        - port: 8888
  egress:
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # NATS in same namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
      ports:
        - protocol: TCP
          port: 4222
    # prom-label-proxy, which the platform installs and owns
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.promLabelProxyNamespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.promLabelProxyPort }}
{{- end }}
